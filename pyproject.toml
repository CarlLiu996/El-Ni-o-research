[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elnino-cta-research"
version = "0.1.0"
description = "Reproducible ENSO, agricultural futures, and CTA proxy research pipeline"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.18",
  "beautifulsoup4>=4.12",
  "earthaccess>=0.14,<0.15",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pypdf>=5.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.31",
  "tushare>=1.4",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
elnino-cta = "elnino_cta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
