[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elnino-cta-research"
version = "0.1.0"
description = "Reproducible ENSO, agricultural futures, and CTA proxy research pipeline"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.18",
  "pandas>=2.0",
  "requests>=2.31",
  "tushare>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
elnino-cta = "elnino_cta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
