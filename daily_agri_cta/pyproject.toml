[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agri-cta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<3", "pandas>=2.2,<4", "pyarrow>=18", "requests>=2.32", "beautifulsoup4>=4.12", "matplotlib>=3.9", "pyyaml>=6", "openpyxl>=3.1"]
[project.optional-dependencies]
test = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
