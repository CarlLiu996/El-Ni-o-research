name: Refresh and monitor research

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh external data before monitoring
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: research-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_HTTP_URL: ${{ vars.TUSHARE_HTTP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Refresh data
        if: ${{ github.event_name == 'schedule' || inputs.refresh_data }}
        run: elnino-cta refresh --start 2015-01-01 --end "$(date -u +%F)" --futures-provider tushare
      - name: Build monitoring snapshot and debrief
        run: elnino-cta monitor
      - name: Commit refreshed research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports/monitoring
          git diff --cached --quiet || git commit -m "Update research monitoring $(date -u +%F)"
          git push
